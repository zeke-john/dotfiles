# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Monitor lid state and auto-enable/disable laptop screen
exec-once = lid-monitor

# Event-driven monitor hotplug — migrates windows between linked workspaces
exec-once = monitor-hotplug

# Cap single tiled window width on external monitor
exec-once = ~/.config/hypr/scripts/single-window-gaps.sh
