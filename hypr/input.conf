# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu

  # Use a specific keyboard variant if needed (e.g. intl for international keyboards)
  # kb_variant = intl

  kb_layout = us
  # kb_options = compose:caps # ,grp:alts_toggle
  kb_options = altwin:swap_alt_win

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  sensitivity = 0.31

  # Turn off mouse acceleration (default: false)
  # force_no_accel = true

  natural_scroll = true

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Tap to click (like Mac - light tap registers as click)
    tap-to-click = true

    # Two-finger tap for right-click (like Mac)
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.2

    # Enable the touchpad while typing
    # disable_while_typing = false

    # Left-click-and-drag with three fingers
    # drag_3fg = 1
  }
}

# Disable the touchscreen
device {
  name = nvtk0603:00-0603:f200
  enabled = false
}

# Per-app scroll speed
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.4
windowrule = match:class dev.zed.Zed, scroll_touchpad 1.5
windowrule = match:class helium, scroll_touchpad 0.3

# Three-finger swipe to switch workspaces (low distance = quick snap like Mac)
gesture = 3, horizontal, workspace

