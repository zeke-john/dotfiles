# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.config/hypr/looknfeel-defaults.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# Waybar blur (liquid metal effect)
layerrule = blur on, match:namespace waybar
layerrule = blur_popups on, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar
layerrule = xray on, match:namespace waybar

# Snap workspace gesture quicker (less distance needed)
gestures {
    workspace_swipe_distance = 50
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 10
}

# SUPER C/V/X (copy/paste/cut) come from default clipboard.conf — do NOT re-bind here
# (duplicate binds stack in Hyprland and fire twice, causing double paste)

# Mac-style Alt+key shortcuts (for laptop keyboard where Alt is next to spacebar)
bindd = ALT, C, Copy, sendshortcut, CTRL, Insert, activewindow
bindd = ALT, V, Paste, sendshortcut, SHIFT, Insert, activewindow
bindd = ALT, X, Cut, sendshortcut, CTRL, X, activewindow
bindd = ALT, A, Select all, sendshortcut, CTRL, A, activewindow
bindd = SUPER, A, Select all, sendshortcut, CTRL SHIFT, A, activewindow
bindd = ALT, Z, Undo, sendshortcut, CTRL, Z, activewindow
bindd = ALT, W, Close tab, sendshortcut, CTRL, W, activewindow
bindd = ALT, T, New tab, sendshortcut, CTRL, T, activewindow
bindd = ALT, L, Address bar, sendshortcut, CTRL, L, activewindow
bindd = ALT, F, Find, sendshortcut, CTRL, F, activewindow
bindd = ALT, S, Save, sendshortcut, CTRL, S, activewindow
bindd = ALT, R, Reload, sendshortcut, CTRL, R, activewindow
bindd = ALT, SPACE, Launch apps, exec, omarchy-launch-walker
bindd = ALT, code:10, Switch to workspace 1, exec, /home/zeke/.local/bin/hypr-linked-workspace 1
bindd = ALT, code:11, Switch to workspace 2, exec, /home/zeke/.local/bin/hypr-linked-workspace 2
bindd = ALT, code:12, Switch to workspace 3, exec, /home/zeke/.local/bin/hypr-linked-workspace 3
bindd = ALT, code:13, Switch to workspace 4, exec, /home/zeke/.local/bin/hypr-linked-workspace 4
bindd = ALT, code:14, Switch to workspace 5, exec, /home/zeke/.local/bin/hypr-linked-workspace 5
bindd = ALT, code:15, Switch to workspace 6, exec, /home/zeke/.local/bin/hypr-linked-workspace 6
bindd = ALT, code:16, Switch to workspace 7, exec, /home/zeke/.local/bin/hypr-linked-workspace 7
bindd = ALT, code:17, Switch to workspace 8, exec, /home/zeke/.local/bin/hypr-linked-workspace 8
bindd = ALT, code:18, Switch to workspace 9, exec, /home/zeke/.local/bin/hypr-linked-workspace 9
bindd = ALT, code:19, Switch to workspace 10, exec, /home/zeke/.local/bin/hypr-linked-workspace 10
bindd = ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec
bindd = ALT, W, Close window, killactive,
bindd = ALT, F, Fullscreen, fullscreen, 0
unbind = ALT, TAB
unbind = ALT SHIFT, TAB
unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
bindd = ALT, TAB, Next workspace on monitor, exec, /home/zeke/.local/bin/hypr-cycle-workspace next
bindd = ALT SHIFT, TAB, Prev workspace on monitor, exec, /home/zeke/.local/bin/hypr-cycle-workspace prev
bindd = SUPER, TAB, Next workspace on monitor, exec, /home/zeke/.local/bin/hypr-cycle-workspace next
bindd = SUPER SHIFT, TAB, Prev workspace on monitor, exec, /home/zeke/.local/bin/hypr-cycle-workspace prev
bindd = ALT SHIFT, code:10, Move window to workspace 1, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 1
bindd = ALT SHIFT, code:11, Move window to workspace 2, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 2
bindd = ALT SHIFT, code:12, Move window to workspace 3, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 3
bindd = ALT SHIFT, code:13, Move window to workspace 4, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 4
bindd = ALT SHIFT, code:14, Move window to workspace 5, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 5
bindd = ALT SHIFT, code:15, Move window to workspace 6, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 6
bindd = ALT SHIFT, code:16, Move window to workspace 7, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 7
bindd = ALT SHIFT, code:17, Move window to workspace 8, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 8
bindd = ALT SHIFT, code:18, Move window to workspace 9, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 9
bindd = ALT SHIFT, code:19, Move window to workspace 10, exec, /home/zeke/.local/bin/hypr-linked-movetoworkspace 10

# Bind workspaces to monitors dynamically (detects any external monitor)
exec-once = /home/zeke/.local/bin/hypr-setup-workspaces
exec-once = /home/zeke/.local/bin/hypr-monitor-handler


# Warp cursor to center of window on focus change
cursor {
    no_warps = false
}

# Extra Alt+key shortcuts for Neovim (only keys NOT already in omarchy defaults)
# Omarchy defaults already handle: SUPER+S,Z,C,V,X,A
bindd = SUPER SHIFT, Z, Redo, sendshortcut, CTRL SHIFT, Z, activewindow
bindd = SUPER, F, Find, sendshortcut, CTRL, F, activewindow
bindd = SUPER, P, Command palette, sendshortcut, CTRL, P, activewindow
bindd = SUPER, period, Code action, sendshortcut, CTRL, period, activewindow
bindd = SUPER, L, Select line, sendshortcut, CTRL, L, activewindow
bindd = SUPER, Y, Redo, sendshortcut, CTRL, Y, activewindow
bindd = SUPER SHIFT, D, Duplicate, sendshortcut, CTRL SHIFT, D, activewindow
bindd = SUPER SHIFT, F, Format, sendshortcut, CTRL SHIFT, F, activewindow
bindd = SUPER SHIFT, K, Delete line, sendshortcut, CTRL SHIFT, K, activewindow


# Laptop lid handling (ref: basecamp/omarchy#427)


# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
