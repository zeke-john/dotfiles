# Application launchers
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER ALT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER ALT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime


# Mac-style function keys
unbind = , XF86MonBrightnessDown
unbind = , XF86MonBrightnessUp
bindeld = , XF86MonBrightnessDown, Brightness down, exec, omarchy-brightness-display 1%-
bindeld = , XF86MonBrightnessUp, Brightness up, exec, omarchy-brightness-display +1%
bindeld = , F1, Brightness down, exec, omarchy-brightness-display 1%-
bindeld = , F2, Brightness up, exec, omarchy-brightness-display +1%
bindeld = , F5, Keyboard brightness down, exec, omarchy-brightness-keyboard down
bindeld = , F6, Keyboard brightness up, exec, omarchy-brightness-keyboard up
bindld = , F7, Previous track, exec, $osdclient --playerctl previous
bindld = , F8, Play/Pause, exec, $osdclient --playerctl play-pause
bindld = , F9, Next track, exec, $osdclient --playerctl next
bindld = , F10, Mute, exec, $osdclient --output-volume mute-toggle
bindeld = , F11, Volume down, exec, $osdclient --output-volume lower
bindeld = , F12, Volume up, exec, $osdclient --output-volume raise

# Unbind WM defaults so keys pass through to apps (physical Alt+key)
unbind = SUPER, F
unbind = SUPER, T
unbind = SUPER, P
unbind = SUPER, S
unbind = SUPER, W
unbind = SUPER, J
bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
unbind = SUPER, O
unbind = SUPER, G
bindd = SUPER, G, Toggle group, togglegroup
bindd = ALT, G, Toggle group, togglegroup
unbind = SUPER, K
unbind = SUPER, RIGHT
unbind = SUPER, LEFT
unbind = SUPER, L
unbind = SUPER SHIFT, L
unbind = SUPER SHIFT, F
unbind = SUPER SHIFT, D
unbind = SUPER SHIFT, N
unbind = SUPER SHIFT, I

# Close window
bindd = SUPER, W, Close window, killactive,

# Full width toggle
bindd = SUPER, D, Full width, fullscreen, 1

# Move window focus
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = ALT, LEFT, movefocus, l
bind = ALT, RIGHT, movefocus, r
bind = ALT, UP, movefocus, u
bind = ALT, DOWN, movefocus, d

# Navigate workspaces
bindd = SUPER, L, Next group tab, changegroupactive, f
bindd = SUPER, H, Previous group tab, changegroupactive, b
bindd = ALT, L, Next group tab, changegroupactive, f
bindd = ALT, H, Previous group tab, changegroupactive, b

# Resize windows
bind = CTRL, LEFT, resizeactive, -20 0
bind = CTRL, RIGHT, resizeactive, 20 0
bind = CTRL, UP, resizeactive, 0 -20
bind = CTRL, DOWN, resizeactive, 0 20

# Lock screen
bindd = SUPER SHIFT, L, Lock machine, exec, omarchy-lock-screen

# Install/remove packages
bindd = SUPER ALT, I, Install via package, exec, xdg-terminal-exec --app-id=org.omarchy.terminal omarchy-package-install
bindd = SUPER SHIFT ALT, I, Install via AUR, exec, xdg-terminal-exec --app-id=org.omarchy.terminal omarchy-package-aur-install
bindd = SUPER SHIFT, R, Remove application, exec, xdg-terminal-exec --app-id=org.omarchy.terminal omarchy-package-remove

