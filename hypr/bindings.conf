# Text-to-speech: read the highlighted text aloud with Piper (fully offline)
bindd = SUPER ALT, R, Read highlighted text aloud, exec, /home/zeke/.local/bin/speak-selection
bindd = SUPER ALT, X, Stop reading aloud, exec, /home/zeke/.local/bin/stop-speech
# Hold Super and middle-click anywhere to read the highlighted text
bind = SUPER, mouse:274, exec, /home/zeke/.local/bin/speak-selection
